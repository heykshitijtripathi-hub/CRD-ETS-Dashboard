<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobility Analytics Portal</title>

<style>
:root{
  --navy:#1F2A44;
  --accent:#2456C9;
  --canvas:#EEF1F8;
  --panel:#FFFFFF;
  --line:#E1E5EF;
  --ink:#1F2A44;
  --muted:#7C879E;
  --green:#3CAA5B;
  --blue:#2456C9;
  --pink:#D6337F;
  --orange:#E8792B;
  --teal:#20B2AA;
  --purple:#7A4FC9;
  --radius:12px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--canvas);
  color:var(--ink);
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
*{font-family:inherit;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
#root{min-height:100vh;}

/* ================= HOME ================= */
.home-wrap{padding:26px 30px 30px; max-width:1400px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
.home-top{display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:24px;}
.home-logo{display:flex; align-items:center; gap:4px; font-weight:700; font-size:17px; color:var(--navy); white-space:nowrap;}
.home-logo .dot{width:5px;height:5px;border-radius:50%;background:#D6353F; display:inline-block; margin:0 1px 8px 1px;}
.home-title-box{
  background:#fff; border-radius:10px; padding:11px 30px; text-align:center;
  font-weight:700; font-size:19px; color:var(--ink); min-width:260px;
  box-shadow:0 1px 2px rgba(20,30,60,0.04);
}
.home-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px; flex:1; align-content:start;}
@media(min-width:680px){.home-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:980px){.home-grid{grid-template-columns:repeat(5,1fr);}}

.dcard{
  background:#fff; border-radius:9px; overflow:hidden; cursor:pointer;
  box-shadow:0 1px 2px rgba(20,30,60,0.05); border:1px solid var(--line);
  transition:transform .15s ease, box-shadow .15s ease;
}
.dcard:hover{transform:translateY(-2px); box-shadow:0 10px 20px -14px rgba(20,30,60,0.28);}
.dcard .thumb{
  background:#F4F6FB; padding:7px; height:114px;
}
.thumb-inner{display:flex; height:100%; gap:0;}
.trail{width:13px; flex:0 0 13px; background:#1F2A44; border-radius:3px 0 0 3px; display:flex; flex-direction:column; align-items:center; padding-top:8px; gap:3px;}
.trail i{width:6px; height:5px; border-radius:1px; background:#fff;}
.tmain{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; padding:5px 5px 5px 7px;}
.tkpis{display:flex; gap:5px;}
.tkpis span{background:#fff; border:1px solid #EAEDF4; border-radius:3px; padding:2px 5px; font-size:7.6px; font-weight:700; flex:1; text-align:center; white-space:nowrap; overflow:hidden;}
.tgrid{flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1.5fr 1fr; gap:4px;}
.tcell{background:#fff; border-radius:3px; position:relative; min-height:0; min-width:0; border:1px solid #F0F2F8;}
.tcell.big{grid-column:1 / -1;}
.tcell canvas{position:absolute; inset:3px; width:calc(100% - 6px) !important; height:calc(100% - 6px) !important;}
.dcard .cap{padding:9px 10px; text-align:center; font-weight:700; font-size:11.5px; color:var(--ink); border-top:1px solid var(--line); line-height:1.3;}

.divisions-grid{grid-template-columns:repeat(2,1fr) !important; max-width:820px; margin:0 auto; gap:26px !important;}
.div-card .thumb.div-thumb{height:220px; padding:12px;}
.div-card .cap{font-size:16px; padding:14px 16px;}
.grid-back{display:inline-block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:12px;}
.grid-back:hover{color:var(--accent);}
@media(max-width:640px){.divisions-grid{grid-template-columns:1fr !important; max-width:420px;} .div-card .thumb.div-thumb{height:180px;}}

/* ================= DASHBOARD REPORT SHELL ================= */
.report{display:flex; min-height:100vh;}
.rail{
  width:186px; flex:0 0 186px; background:#fff; border-right:1px solid var(--line);
  padding:20px 16px; display:flex; flex-direction:column;
}
.rail .rlogo{display:flex; align-items:center; gap:4px; font-weight:700; font-size:16px; color:var(--navy);}
.rail .rlogo .dot{width:6px;height:6px;border-radius:50%;background:#D6353F;}
.rail .rtitle{font-size:14px; font-weight:700; color:var(--ink); margin:16px 0 20px; line-height:1.3;}
.tab-btn{
  display:block; text-align:left; padding:9px 14px; border-radius:18px; font-size:12.5px; font-weight:600;
  margin-bottom:8px; border:1px solid var(--line); color:var(--ink); background:#fff;
}
.tab-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.rail-spacer{flex:1;}
.rail .back{font-size:11.5px; color:var(--muted); font-weight:600; padding-top:14px; border-top:1px solid var(--line);}
.rail .back:hover{color:var(--accent);}

.report-main{flex:1; min-width:0; padding:20px 26px 50px;}

.topbar{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:16px; flex-wrap:wrap;}
.filters-row{display:flex; gap:12px; flex-wrap:wrap;}
.ffield{display:flex; flex-direction:column; gap:5px;}
.ffield label{font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.02em;}
.ffield .box{
  border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:12px; color:var(--ink);
  background:#fff; min-width:84px; display:flex; align-items:center; justify-content:space-between; gap:8px; font-weight:500;
}
.ffield .box svg{width:9px;height:9px;opacity:.45;flex:none;}
.refresh{font-size:10.5px; color:var(--muted); text-align:right; white-space:nowrap; font-weight:500;}
.refresh b{display:block; color:var(--ink); font-size:12px; font-weight:600; margin-top:2px;}

.kpi-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
.kpi-card{
  background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 20px;
  text-align:center; flex:1; min-width:126px;
}
.kpi-card .lbl{font-size:11px; color:var(--muted); font-weight:600;}
.kpi-card .val{font-size:25px; font-weight:700; margin-top:5px;}

.panel-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:14px;}
@media(max-width:1050px){.panel-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:720px){.panel-grid{grid-template-columns:1fr;}}
.panel-grid.two{grid-template-columns:repeat(2,1fr);}
.panel{background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 16px;}
.panel h5{font-size:12px; font-weight:700; color:var(--ink); margin:0 0 8px;}
.chartbox{position:relative; height:186px;}
.chartbox.tall{height:264px;}

table.dtable{width:100%; border-collapse:collapse; font-size:12.5px;}
table.dtable th{text-align:left; font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.02em; padding:8px 10px; border-bottom:1px solid var(--line);}
table.dtable td{padding:8px 10px; border-bottom:1px solid #F1F3F8; color:var(--ink);}
table.dtable tr:last-child td{border-bottom:none;}
table.dtable td.num, table.dtable th.num{text-align:right; font-variant-numeric:tabular-nums;}

.menu-btn{display:none; align-items:center; gap:8px; background:var(--navy); color:#fff; border:none; padding:9px 12px; border-radius:8px; font-size:12.5px; font-weight:600; margin:0 0 14px;}
@media(max-width:820px){
  .rail{position:fixed; left:-210px; z-index:40; height:100vh; transition:left .2s ease;}
  .rail.open{left:0; box-shadow:0 0 0 100vmax rgba(0,0,0,0.35);}
  .menu-btn{display:flex;}
  .report-main{padding-left:18px; padding-right:18px;}
}
</style>
</head>

<script>const DATA = JSON.parse(document.getElementById('data-blob').textContent);

/* Each card's preview is built from a hand-picked (chart type, metric) pair
   chosen for THAT dashboard, cycling through area/line/vertical-bar/horizontal-bar
   plus alternating ring/pie donuts - so cards are visually distinct from each
   other, not the same 3-widget template recolored. Same recipe drives both the
   ETS and CRD version of a given dashboard kind (their data shapes match). */
const THUMB_SRC = {
  ets:['mis', ()=>DATA.ets], trip:['booking', ()=>DATA.trip], fleet:['fleet', ()=>DATA.fleet],
  driver:['driver', ()=>DATA.driver], vendor:['vendor', ()=>DATA.vendor], fuel:['fuel', ()=>DATA.fuel],
  maint:['maint', ()=>DATA.maint], safety:['safety', ()=>DATA.safety], cx:['cx', ()=>DATA.cx], finance:['finance', ()=>DATA.finance],
  crd_mis:['mis', ()=>CRD_DATA.mis], crd_booking:['booking', ()=>CRD_DATA.booking], crd_fleet:['fleet', ()=>CRD_DATA.fleet],
  crd_chauffeur:['driver', ()=>CRD_DATA.chauffeur], crd_vendor:['vendor', ()=>CRD_DATA.vendor], crd_fuel:['fuel', ()=>CRD_DATA.fuel],
  crd_maint:['maint', ()=>CRD_DATA.maint], crd_safety:['safety', ()=>CRD_DATA.safety], crd_cx:['cx', ()=>CRD_DATA.cx], crd_finance:['finance', ()=>CRD_DATA.finance],
};

function thumbSpec(kind, d){
  switch(kind){
    case 'mis': return {
      a:{type:'area', labels:d.trend.map(t=>t.DATE.slice(5)), data:d.trend.map(t=>t.trips)},
      b:{type:'bar', orient:'h', labels:d.city.slice(0,6).map(c=>c.LOCATION), data:d.city.slice(0,6).map(c=>c.trips)},
      donut:{style:'ring', labels:['Arrival Delay','Departure Delay'], data:[d.kpi.arrivalDelays, d.kpi.departureDelays]},
    };
    case 'booking': return {
      a:{type:'bar', orient:'v', labels:d.delayReason.map(r=>r.reason), data:d.delayReason.map(r=>r.count)},
      b:{type:'line', labels:d.shift.map(s=>s.Shift), data:d.shift.map(s=>s.onTime)},
      donut:{style:'pie', labels:d.client.slice(0,5).map(c=>c.Client), data:d.client.slice(0,5).map(c=>c.trips)},
    };
    case 'fleet': return {
      a:{type:'bar', orient:'h', labels:d.vtype.map(v=>v['Vehicle Type']), data:d.vtype.map(v=>v.trips)},
      b:{type:'bar', orient:'v', labels:d.city.slice(0,6).map(c=>c.City), data:d.city.slice(0,6).map(c=>c.util)},
      donut:{style:'ring', labels:d.status.map(s=>s.status), data:d.status.map(s=>s.count)},
    };
    case 'driver': return {
      a:{type:'line', labels:d.top.slice(0,8).map(t=>t['Driver Name']), data:d.top.slice(0,8).map(t=>t.trips)},
      b:{type:'bar', orient:'h', labels:d.vendor.map(v=>v.Vendor), data:d.vendor.map(v=>v.onTime)},
      donut:{style:'pie', labels:d.vendor.map(v=>v.Vendor), data:d.vendor.map(v=>v.trips)},
    };
    case 'vendor': return {
      a:{type:'bar', orient:'v', labels:d.vendor.map(v=>v.Vendor), data:d.vendor.map(v=>v.cost)},
      b:{type:'bar', orient:'h', labels:d.vendor.map(v=>v.Vendor), data:d.vendor.map(v=>v.compliance)},
      donut:{style:'ring', labels:d.vendor.map(v=>v.Vendor), data:d.vendor.map(v=>v.trips)},
    };
    case 'fuel': return {
      a:{type:'bar', orient:'h', labels:d.fuelType.map(f=>f['Fuel Type']), data:d.fuelType.map(f=>f.cost)},

      donut:{style:'pie', labels:d.vtype.map(v=>v['Vehicle Type']), data:d.vtype.map(v=>v.cost)},
    };

      b:{type:'bar', orient:'h', labels:d.vtype.map(v=>v['Vehicle Type']), data:d.vtype.map(v=>v.cost)},
      donut:{style:'ring', labels:d.status.map(s=>s.status), data:d.status.map(s=>s.count)},
    };

      a:{type:'bar', orient:'v', labels:d.itype.map(i=>i.type), data:d.itype.map(i=>i.count)},
      b:{type:'bar', orient:'h', labels:d.rootcause.map(r=>r.cause), data:d.rootcause.map(r=>r.count)},

/* Tight-range metrics (utilisation %, cost/km, compliance %...) look like a flat
   barcode if the value axis starts at zero. Auto-zoom the axis to the data's own
   range whenever the spread is small, so real variation stays visible; leave
   naturally dramatic counts (incidents, status mix...) starting at zero. */
function axisRange(data){
  const min = Math.min(...data), max = Math.max(...data);
  const spread = max - min;
  if(min <= 0 || spread <= 0) return {beginAtZero:true};
  if(spread / max < 0.35){
    const pad = spread * 0.7;
    return {beginAtZero:false, min: Math.max(0, min - pad), suggestedMax: max + pad * 0.4};
  }
  return {beginAtZero:true};
}

  const elA = document.getElementById(`tc-${c.id}-a`);

        options:{...common,scales:{x:hideAxis,y:{...hideAxis,...axisRange(a.data)}}}});

function _hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0;}return h>>>0;}
function _mkRng(seed){let s=_hash(seed);return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const _R = _mkRng('crd-2026');
function ri(min,max){return Math.round(min+_R()*(max-min));}
function rf(min,max,dec){dec=dec||1;return +(min+_R()*(max-min)).toFixed(dec);}
function distribute(total,n,varPct){
  varPct = varPct||0.4;
  const weights = Array.from({length:n},()=>0.6+_R()*varPct*2);
  const sum = weights.reduce((a,b)=>a+b,0);
  return weights.map(w=>Math.max(1,Math.round(total*w/sum))).sort((a,b)=>b-a);
}
function dateRange(start,days){
  const out=[]; const d=new Date(start+'T00:00:00Z');
  for(let i=0;i<days;i++){ out.push(d.toISOString().slice(0,10)); d.setUTCDate(d.getUTCDate()+1); }
  return out;
}

const TAB_KEYS = ['overview','insights','trend','details'];
let CUR_VIEW = 'divisions', CUR_DIVISION = null, CUR_DASH = null, CUR_TAB = 'overview';

function goDivisions(){ CUR_VIEW='divisions'; CUR_DIVISION=null; CUR_DASH=null; destroyCharts(); render(); }
function openDivision(div){ CUR_VIEW='grid'; CUR_DIVISION=div; CUR_DASH=null; destroyCharts(); render(); }
function openDashboard(id, tab){
  const card = CARDS.find(c=>c.id===id);
  CUR_DIVISION = card ? card.division : CUR_DIVISION;
  CUR_VIEW='dashboard'; CUR_DASH = id; CUR_TAB = tab || 'overview';
  render();
}
function switchTab(tab){ CUR_TAB = tab; render(); }
function goGrid(){ CUR_VIEW='grid'; CUR_DASH=null; destroyCharts(); render(); }

function render(){
  destroyCharts();
  if(CUR_VIEW==='divisions'){ renderDivisions(); return; }
  if(CUR_VIEW==='grid'){ renderGrid(CUR_DIVISION); return; }

  const cfg = DASH[CUR_DASH];
  const divLabel = CUR_DIVISION==='crd' ? 'CRD Dashboards' : 'ETS Dashboards';
  const labels = {overview:'Overview', insights:cfg.insightsLabel, trend:'Trend', details:'Details'};
  const rail = `
    <div class="rail" id="rail">
      ${logoMark()}
      <div class="rtitle">${cfg.title}</div>
      ${TAB_KEYS.map(t=>`<button class="tab-btn ${t===CUR_TAB?'active':''}" data-tab="${t}">${labels[t]}</button>`).join('')}
      <div class="rail-spacer"></div>
      <a class="back" data-grid="1">\u2190 ${divLabel}</a>
    </div>`;

  document.getElementById('root').innerHTML = `
    <div class="report">
      ${rail}
      <div class="report-main">
        <button class="menu-btn" id="menuBtn">\u2630 Menu</button>
        <div class="topbar">
          <div class="filters-row">${cfg.filters.map(f=>`<div class="ffield"><label>${f[0]}</label><div class="box">${f[1]}${CHEV}</div></div>`).join('')}</div>
          <div class="refresh">Last Refresh<b>28 Feb 2026, 11:59 PM</b></div>
        </div>
        <div id="tabContent"></div>
      </div>
    </div>`;

  document.querySelectorAll('[data-tab]').forEach(n=>n.addEventListener('click', ()=>switchTab(n.getAttribute('data-tab'))));
  document.querySelector('[data-grid]').addEventListener('click', goGrid);
  const mb = document.getElementById('menuBtn');
  if(mb) mb.addEventListener('click', ()=>document.getElementById('rail').classList.toggle('open'));

  const content = document.getElementById('tabContent');
  if(CUR_TAB==='overview') renderOverview(content,cfg);
  else if(CUR_TAB==='insights') renderInsights(content,cfg);
  else if(CUR_TAB==='trend') renderTrendTab(content,cfg);
  else renderDetails(content,cfg);
  window.scrollTo(0,0);
}

function panelHTML(id,title,tall){
  return `<div class="panel"><h5>${title}</h5><div class="chartbox${tall?' tall':''}"><canvas id="${id}"></canvas></div></div>`;
}
function kpiRowHTML(kpis){
  return `<div class="kpi-row">${kpis.map(k=>`<div class="kpi-card"><div class="lbl">${k[0]}</div><div class="val" style="color:${PAL[k[2]]}">${k[1]}</div></div>`).join('')}</div>`;
}

function renderOverview(root,cfg){
  const o = cfg.overview;
  root.innerHTML = kpiRowHTML(cfg.kpis) +
    `<div class="panel-grid">
      ${panelHTML('ov_big', o.big.title, true)}
      ${panelHTML('ov_s1', o.side[0].title, true)}
      ${panelHTML('ov_s2', o.side[1].title, true)}
    </div>`;
  if(o.big.type==='area') drawArea('ov_big', o.big.labels, o.big.data, HEX[o.big.color]);
  else drawBar('ov_big', o.big.labels, o.big.data, HEX[o.big.color], o.big.horizontal);
  drawBar('ov_s1', o.side[0].labels, o.side[0].data, HEX[o.side[0].color], o.side[0].horizontal);
  drawBar('ov_s2', o.side[1].labels, o.side[1].data, HEX[o.side[1].color], o.side[1].horizontal);
}

function renderInsights(root,cfg){
  const ins = cfg.insights;
  root.innerHTML = `<div class="panel-grid">
      ${panelHTML('in_1', ins.panels[0].title)}
      ${panelHTML('in_2', ins.panels[1].title)}
      ${panelHTML('in_3', ins.panels[2].title)}
    </div>
    <div class="panel-grid two">
      <div class="panel"><h5>${ins.donut.title}</h5><div class="chartbox tall"><canvas id="in_donut"></canvas></div></div>
      <div class="panel"><h5>${ins.list.title}</h5>
        <table class="dtable"><tbody>${ins.list.rows.map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]}</td></tr>`).join('')}</tbody></table>
      </div>
    </div>`;
  ins.panels.forEach((p,i)=> drawBar('in_'+(i+1), p.labels, p.data, HEX[p.color], p.horizontal));
  drawDonut('in_donut', ins.donut.labels, ins.donut.data);
}

function renderTrendTab(root,cfg){
  const t = cfg.trend;
  root.innerHTML = `<div class="panel-grid two">
      ${panelHTML('tr_1', t.panels[0].title, true)}
      ${panelHTML('tr_2', t.panels[1].title, true)}
    </div>`;
  t.panels.forEach((p,i)=>{
    const id = 'tr_'+(i+1);
    if(p.type==='line') drawLine(id, p.labels, p.series, p.colors.map(c=>HEX[c]));
    else drawGroupedBar(id, p.labels, p.series, p.colors.map(c=>HEX[c]));
  });
}

function renderDetails(root,cfg){
  const d = cfg.details;
  root.innerHTML = `<div class="panel">
    <h5>${d.title}</h5>
    <table class="dtable"><thead><tr>${d.columns.map((c,i)=>`<th class="${i>0?'num':''}">${c}</th>`).join('')}</tr></thead>
    <tbody>${d.rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${i>0?'num':''}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table>
  </div>`;
}
